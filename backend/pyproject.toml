[project]
name = "vllm_manager-backend"
version = "0.1.0"
description = "FastAPI + SQLAlchemy 2.0 样板工程（PostgreSQL）"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "sqlalchemy[asyncio] (>=2.0.40,<2.1.0)",
    "asyncpg (>=0.29.0,<0.30.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "saq[hiredis] (>=0.26.1,<0.27.0)",
    "pytz (>=2024.0,<2025.0)",
    "uuid-utils (>=0.13.0,<0.14.0)",
    "greenlet (>=3.3.0,<4.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "anyio (>=4.0.0,<5.0.0)",
    "itsdangerous (>=2.1.0,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
aiosqlite = "^0.20.0"
ruff = "^0.15.4"
pyright = "^1.1.408"
mypy = "^1.19.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: marks tests as unit tests (fast, isolated, no external dependencies)",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportAssignmentType = "none"
exclude = [".venv", "**/__pycache__"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
  "F",    # 硬错误
  "E",    # 基础风格错误
  "B",    # bugbear
  "UP",   # 语法升级
  "I",    # import 排序
  "SIM",  # 简化逻辑
  "C4",   # 推导式优化
  "PIE",  # Pythonic 写法
]

ignore = [
  "E501", # 行长度交给 formatter（ruff format）
]
